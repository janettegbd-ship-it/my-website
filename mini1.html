<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINI MARKET</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:blue;
    color:#333;
}

header{
    background:#f8d7da;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    color:#b76e79;
}

nav a{
    margin-left:20px;
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:80px 20px;
    background:linear-gradient(to right,#ffe0e6,#fff);
}

.hero h2{
    font-size:50px;
    color:#b76e79;
}

.hero button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    background:#b76e79;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.products{
    padding:50px 20px;
}

.products h2{
    text-align:center;
    color:#b76e79;
    margin-bottom:40px;
}

.product-container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    background:white;
    width:280px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.price{
    color:#b76e79;
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

.card button{
    margin-top:10px;
    padding:12px 20px;
    border:none;
    background:red;
    color:black;
    border-radius:8px;
    cursor:pointer;
    width:100%;
}

.cart{
    position:fixed;
    top:20px;
    right:20px;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    width:220px;
}

footer{
    margin-top:50px;
    background:red;
    text-align:center;
    padding:20px;
    color:white;
}
</style>
</head>

<body>

<header>
  <h1>MINI MARKET</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="hero" id="home">
    <h2>MINI MARKET</h2>
    <button onclick="scrollToProducts()">Shop Now</button>
</div>

<!-- CART -->
<div class="cart">
    <h3>🛒 Cart</h3>

    <p id="cart-count">0 items</p>
    <p id="total">Total: $0</p>

    <div id="cart-items"></div>

    <button onclick="checkout()" style="
        margin-top:10px;
        padding:10px;
        width:100%;
        background:green;
        color:white;
        border:none;
        border-radius:8px;
        cursor:pointer;
    ">
    Checkout
    </button>

    <div id="checkout-box" style="display:none; margin-top:10px;">
        <input id="name" placeholder="Your Name" style="width:100%; padding:5px; margin-top:5px;">
        <input id="address" placeholder="Your Address" style="width:100%; padding:5px; margin-top:5px;">

        <button onclick="payNow()" style="
            margin-top:10px;
            width:100%;
            padding:10px;
            background:black;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        ">
        Pay Now
        </button>
    </div>
</div>

<!-- PRODUCTS -->
<section class="products" id="products">

<h2>Our Products</h2>

<div class="product-container">

    <div class="card">
        <img src="ene.jpg">
        <div class="card-content">
            <h3>ENERGY DRINK</h3>
            <div class="price">3$</div>
            <button onclick="addToCart('ENERGY DRINK',3)">Add To Cart</button>
        </div>
    </div>

    <div class="card">
        <img src="sito.jpg">
        <div class="card-content">
            <h3>CHIPS</h3>
            <div class="price">2$</div>
            <button onclick="addToCart('CHIPS',2)">Add To Cart</button>
        </div>
    </div>

</div>
</section>

<section id="contact" style="padding:50px;text-align:center;">
    <h2>Contact Us</h2>
    <p>WhatsApp: +961 81442139</p>
    <p>Instagram: @janettebd</p>
</section>

<footer>
    © 2026 MINI MARKET - All Rights Reserved
</footer>

<script>

let cart = [];
let total = 0;

function addToCart(product, price){
    cart.push({ name: product, price: price });
    total += price;
    updateCart();
    alert(product + " added to cart ✨");
}

function updateCart(){

    let cartBox = document.getElementById("cart-items");
    cartBox.innerHTML = "";

    cart.forEach(item => {
        cartBox.innerHTML += `<p>• ${item.name} - $${item.price}</p>`;
    });

    document.getElementById("cart-count").innerText =
        cart.length + " items";

    document.getElementById("total").innerText =
        "Total: $" + total;
}

function scrollToProducts(){
    document.getElementById("products")
    .scrollIntoView({ behavior:"smooth" });
}

function checkout(){

    if(cart.length === 0){
        alert("Your cart is empty!");
        return;
    }

    document.getElementById("checkout-box").style.display = "block";
}

function payNow(){

    let name = document.getElementById("name").value;
    let address = document.getElementById("address").value;

    if(name === "" || address === ""){
        alert("Please fill all fields");
        return;
    }

    let order = "ORDER SUMMARY\n\n";
    order += "Name: " + name + "\n";
    order += "Address: " + address + "\n\n";

    cart.forEach(item => {
        order += item.name + " - $" + item.price + "\n";
    });

    order += "\nTOTAL: $" + total;

    alert(order);

    // PayPal redirect (CHANGE USERNAME)
    window.location.href = "https://www.paypal.com/paypalme/YOURUSERNAME/" + total;

    cart = [];
    total = 0;
    updateCart();

    document.getElementById("checkout-box").style.display = "none";
}

</script>

</body>
</html>
